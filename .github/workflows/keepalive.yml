# Keeps the free Supabase project from pausing after a week of no use.
# Once a day this sends one harmless request to the database. It reads nothing private
# (the public key can see nothing) and changes nothing. The web address and public key are
# taken from js/config.js, so there is nothing else to set up.
#
# GitHub switches scheduled jobs off after 60 days with no changes to the repository.
# If you get an email about that, open the Actions tab and click "Enable workflow".
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 14 * * *"   # every day at 14:17 UTC
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: js/config.js
      - name: Ask the database one small question
        run: |
          URL=$(grep -oP 'url: "\Khttps://[^"]+' js/config.js | head -1)
          KEY=$(grep -oP 'anonKey: "\K[^"]+' js/config.js | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "No Supabase settings in js/config.js; nothing to do."; exit 0; fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/profiles?select=id&limit=1")
          echo "Supabase answered with HTTP $STATUS"
          # 200 (empty list) or 401/403 (not allowed to read) both mean the database was reached.
          case "$STATUS" in 2*|401|403) exit 0 ;; *) echo "Unexpected answer"; exit 1 ;; esac
